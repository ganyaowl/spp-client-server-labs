{% extends "base.html" %}
{% block content %}
<h2>Каталог книг</h2>
<table>
    <thead><tr><th>Название</th><th>Автор</th><th>Доступно экземпляров</th></tr></thead>
    <tbody>{% for book in books %}
        <tr><td>{{ book.title }}</td><td>{{ book.author }}</td><td>{{ book.available }}</td></tr>
    {% else %}<tr><td colspan="3">Книг пока нет.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
