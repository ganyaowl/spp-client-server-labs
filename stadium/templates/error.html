{% extends "base.html" %}
{% block content %}
<section class="panel error-card"><span class="badge badge-danger">Действие недоступно</span>
<h1>Не удалось выполнить действие</h1><p class="muted" role="alert">{{ message }}</p>
<div class="form-actions"><a class="button" href="{{ url_for('matches') }}">К матчам</a>{% if g.user and g.user.role == 'cashier' %}<a class="button button-secondary" href="{{ url_for('tickets') }}">К билетам</a>{% endif %}</div></section>
{% endblock %}
